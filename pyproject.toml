[project]
name = "plexters-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bitwarden-sdk>=2.1.0",
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "setuptools>=82.0.1",
    "yt-dlp>=2025.12.8",
]

[project.scripts]
plexter-round-robin = "plexter.playlists.round_robin.cli:main"

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.setuptools.packages.find]
where = ["src"]
