{% if selected and selected|length > 0 %}
  <ul>
    {% for s in selected %}
      <li>
        <b>{{ s.title }}</b> <small><code>{{ s.key }}</code></small>
        <form style="display:inline"
              hx-post="/remove"
              hx-target="#selected"
              hx-swap="innerHTML">
          <input type="hidden" name="key" value="{{ s.key }}">
          <button type="submit">Remove</button>
        </form>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <small>No shows selected</small>
{% endif %}
