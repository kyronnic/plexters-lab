<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Round Robin (Plex)</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 980px; margin: 24px auto; padding: 0 16px; }
        .row { display:flex; gap:16px; align-items:flex-start; }
        .card { border:1px solid #ddd; border-radius:12px; padding:16px; flex:1; }
        input { padding:8px; }
        button { padding:8px 10px; cursor:pointer; }
        .success { padding:12px; background:#e9ffe9; border:1px solid #b7e3b7; border-radius:10px; }
        .error { padding:12px; background:#ffe9e9; border:1px solid #e3b7b7; border-radius:10px; }
        small { color:#666; }
        code { background:#f3f3f3; padding:2px 6px; border-radius:6px; }
        li { margin: 6px 0; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
